<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 15 280 380" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4bd583"/>
      <stop offset="100%" stop-color="#1b7a48"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#80f0ad"/>
      <stop offset="100%" stop-color="#2e9e62"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66e89a"/>
      <stop offset="100%" stop-color="#136b3b"/>
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <mask id="boltMask">
      <rect width="400" height="400" fill="white" />
      <path d="M 160 170 L 90 270 L 145 270 L 110 350 L 205 240 L 155 240 Z" fill="black" stroke="black" stroke-width="16" stroke-linejoin="round" />
    </mask>

    <style>
      .text-ebsa {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #064728;
        letter-spacing: 14px;
      }
      .text-pdf {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 800;
        font-size: 58px;
        fill: #ffffff;
        letter-spacing: 2px;
      }
      /* Magical adaptiveness to light/dark mode! */
      @media (prefers-color-scheme: dark) {
        .text-ebsa {
          fill: #e8f5ee;
        }
      }
    </style>
  </defs>

  <g mask="url(#boltMask)">
    <!-- Document Base -->
    <path d="M 140 30 L 260 30 L 330 100 L 330 300 Q 330 310 320 310 L 140 310 Q 130 310 130 300 L 130 40 Q 130 30 140 30 Z" fill="url(#docGrad)" />
    
    <!-- Folded Corner -->
    <path d="M 260 30 L 260 90 Q 260 100 270 100 L 330 100 Z" fill="url(#foldGrad)" filter="url(#shadow)" />
    
    <!-- PDF Text -->
    <text x="240" y="160" text-anchor="middle" class="text-pdf">PDF</text>
    
    <!-- Lines -->
    <rect x="180" y="195" width="90" height="10" rx="5" fill="#88d9ab" />
    <rect x="180" y="225" width="90" height="10" rx="5" fill="#88d9ab" />
  </g>

  <!-- Lightning Bolt -->
  <path d="M 160 170 L 90 270 L 145 270 L 110 350 L 205 240 L 155 240 Z" fill="url(#boltGrad)" stroke="#1a854d" stroke-width="1" stroke-linejoin="round" />

  <!-- EBSA Text -->
  <text x="210" y="380" text-anchor="middle" class="text-ebsa">EBSA</text>
</svg>
